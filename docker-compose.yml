name: auth

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:3001:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl; ask the management port with bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      retries: 60

  # One-off: applies realm/ to Keycloak, then exits. Run again with
  # `docker compose run --rm keycloak-config-cli`.
  keycloak-config-cli:
    image: adorsys/keycloak-config-cli:6.5.1-26.5.5
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: ${KC_ADMIN_USERNAME:-admin}
      KEYCLOAK_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      IMPORT_FILES_LOCATIONS: /config/*.json
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      # The realm file lists only the required actions it changes; keep the rest.
      IMPORT_MANAGED_REQUIREDACTION: no-delete
      # For $${javascript: ...} in the realm file, which expands URL lists.
      # The JS engine unpacks itself to a cache; the image's user has no home.
      IMPORT_VARSUBSTITUTION_SCRIPTEVALUATIONENABLED: "true"
      JAVA_OPTS: -Dpolyglot.engine.userResourceCache=/tmp/polyglot -Dpolyglot.engine.WarnInterpreterOnly=false
      AUTH_URL: ${AUTH_URL:-http://localhost:3001}
      WEBSITE_URL: ${WEBSITE_URL:-http://localhost:5173}
      GRID_EDITOR_WEB_URLS: ${GRID_EDITOR_WEB_URLS:-}
      DISCOURSE_URL: ${DISCOURSE_URL:-}
      WEBSITE_CLIENT_SECRET: ${WEBSITE_CLIENT_SECRET:-}
      DISCOURSE_CLIENT_SECRET: ${DISCOURSE_CLIENT_SECRET:-}
      GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - ./realm:/config:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 2s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"

volumes:
  postgres:
