# The recovery email (workflows/recovery-email.json) and any update-password email sent from the admin console.
# MessageFormat: an apostrophe is written ''. {0} link, {4} how long the link works.
executeActionsSubject=Set a new password for your Intech Studio account
executeActionsBody=Hi,\n\nWe have moved Intech Studio accounts to a new sign-in system, which every Intech Studio service uses: the website and shop, the forum, Grid Editor and Profile Cloud. Passwords could not be moved with them, so you need to set a new one.\n\nSet a new password:\n{0}\n\nThe link works for {4}. After that, choose "Forgot password" on the sign-in page and we''ll email you a new one.\n\nIf you sign in with Google, nothing changes: keep using the Google button. Grid Editor and Profile Cloud move to the new sign-in with their next update; until then they keep your current password.\n\nYou''re receiving this because this email address has an Intech Studio account. If you don''t use it, you can ignore this email.
executeActionsBodyHtml=<p>Hi,</p><p>We have moved Intech Studio accounts to a new sign-in system, which every Intech Studio service uses: the website and shop, the forum, Grid Editor and Profile Cloud. Passwords could not be moved with them, so you need to set a new one.</p><p><a href="{0}">Set a new password</a></p><p>The link works for {4}. After that, choose "Forgot password" on the sign-in page and we''ll email you a new one.</p><p>If you sign in with Google, nothing changes: keep using the Google button. Grid Editor and Profile Cloud move to the new sign-in with their next update; until then they keep your current password.</p><p>You''re receiving this because this email address has an Intech Studio account. If you don''t use it, you can ignore this email.</p>
